# GitHub Actions 云编译：R4 黑白图鉴菜单启动器
# 用 devkitPro 官方 Docker 镜像(devkitpro/devkitarm)在云端编译 -> 产出 r4zukan.nds 供下载
# 触发方式：推送代码 或 在 Actions 页手动点 Run workflow

name: Build r4zukan.nds

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 编译(输出存日志,不中断)
        run: |
          # 先装 nds-dev(libnds+ndstool)，再编译；完整输出写入 build.log，编译失败也不中断
          set +e
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e DEVKITPRO=/opt/devkitpro \
            -e DEVKITARM=/opt/devkitpro/devkitARM \
            devkitpro/devkitarm:latest \
            bash -c "dkp-pacman -S --noconfirm --needed nds-dev && bash diag.sh && make clean && make" > build.log 2>&1
          echo "build_exit=$?"
          echo "===== 日志末尾 60 行 ====="
          tail -n 60 build.log
          echo "===== 日志结束 ====="

      - name: 上传构建日志
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: 上传编译产物 r4zukan.nds
        uses: actions/upload-artifact@v4
        with:
          name: r4zukan.nds
          path: r4zukan.nds
          if-no-files-found: ignore
